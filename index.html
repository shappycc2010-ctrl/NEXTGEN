<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextGen</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 700px;
      padding: 20px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      color: #00ff99;
    }
    p {
      font-size: 1.2rem;
      opacity: 0.9;
    }
    button {
      margin-top: 25px;
      padding: 15px 30px;
      border: none;
      border-radius: 30px;
      background: #00ff99;
      color: #000;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #00cc77;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>THE FUTURE</h1>
    <p>Welcome to NextGen — where innovation meets technology.</p>
    <button>Get Started</button>
  </div>
</body>
      </html>
